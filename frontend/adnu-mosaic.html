<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdNU Mosaic</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;1,400&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
<style>
  /* Unread / Read pin states */
  .pin-card.unread {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(245,200,66,0.3), 0 4px 16px rgba(245,200,66,0.1);
  }
  .pin-card.unread .pin-img::before {
    content: '';
    position: absolute;
    top: 8px;
    left: 8px;
    width: 10px;
    height: 10px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(245,200,66,0.3);
    z-index: 3;
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.7; }
  }
  .pin-card.read {
    border-color: var(--gray-200);
    opacity: 0.92;
  }
  .pin-card.read .pin-title {
    color: var(--gray-600);
  }
  .pin-card.read .pin-img {
    filter: grayscale(15%);
  }
</style>
<base target="_blank">
</head>
<body>

<div class="loading-overlay" id="loader">
  <div class="loading-logo">AdNU <span>Mosaic</span></div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  <div class="loading-text">Ateneo Pickleball Club</div>
</div>

<nav id="navbar">
  <div class="nav-logo">AdNU <span>Mosaic</span></div>
  <div class="nav-center-links">
    <button type="button" class="nav-btn active" onclick="event.preventDefault(); showPage('pins')">Pins</button>
    <button type="button" class="nav-btn" onclick="event.preventDefault(); window.location.href='/map'">Pin Map</button>
    <button type="button" class="nav-btn" onclick="event.preventDefault(); window.location.href='/map'">Create Pin</button>
  </div>
  <div class="nav-right-links">
    <button type="button" class="nav-btn" onclick="event.preventDefault(); window.location.href='admin.html'">Admin</button>
  </div>
</nav>

<!-- PINS READ PAGE -->
<div class="page active" id="page-pins">
  <div class="pins-page">
    <div class="pins-header">
      <div>
        <h1>Pins</h1>
        <p>Explore campus pins pinned by students & faculty</p>
      </div>
    </div>
    
    <div class="pins-controls">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search-input" placeholder="Search pins by title or story…" oninput="filterPins()">
      </div>
    </div>
    <div class="stats-bar" id="stats-bar"></div>
    <div class="pins-grid" id="pins-grid"></div>
  </div>
</div>

<script>
/* ── Flask API base URL ── */
const API = 'http://127.0.0.1:5000';

function resolveImageUrl(url) {
  if (!url) return url;
  return url.startsWith('/uploads/') ? API + url : url;
}

let allPins = [];

/* ── Page routing ── */
function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const target = document.getElementById('page-' + page);
  if (target) target.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => {
    if (b.textContent.toLowerCase().includes(page)) b.classList.add('active');
  });
  if (page === 'pins') loadPins();
}

/* ── Helpers ── */
function showAlert(id, type, msg) {
  const el = document.getElementById(id);
  el.className = 'alert show ' + type;
  el.textContent = msg;
}
function hideAlert(id) {
  const el = document.getElementById(id);
  el.className = 'alert';
  el.textContent = '';
}
function fieldError(id, show) {
  const el = document.getElementById('err-' + id);
  if (el) el.className = 'field-error' + (show ? ' show' : '');
  const inp = document.getElementById(id);
  if (inp) inp.classList.toggle('error', show);
}
function val(id) { return (document.getElementById(id) || {}).value || ''; }

/* ── READ PINS TRACKING ── */
function getReadPins() {
  try { return JSON.parse(localStorage.getItem('read_pins') || '[]'); }
  catch (e) { return []; }
}
function markPinAsRead(pinId) {
  const read = getReadPins();
  const id = Number(pinId);
  if (!read.includes(id) && !read.includes(String(pinId))) {
    read.push(id);
    localStorage.setItem('read_pins', JSON.stringify(read));
  }
}
function isPinRead(pinId) {
  const read = getReadPins();
  const id = Number(pinId);
  return read.includes(id) || read.includes(String(pinId));
}

/* ── LOAD PINS — calls Flask GET /api/pins ── */
async function loadPins() {
  const grid = document.getElementById('pins-grid');
  grid.innerHTML = '<p style="color:var(--gray-400);padding:2rem;grid-column:1/-1;">Loading pins from database…</p>';
  try {
    const res  = await fetch('http://127.0.0.1:5000/api/pins');
    const data = await res.json();
    if (!res.ok) { grid.innerHTML = '<p style="color:var(--danger);padding:2rem;grid-column:1/-1;">Failed to load pins.</p>'; return; }
    allPins = data;
    renderPins(allPins);
  } catch (err) {
    grid.innerHTML = '<p style="color:var(--danger);padding:2rem;grid-column:1/-1;">Cannot reach server. Make sure Flask is running on port 5000.</p>';
  }
}

/* ── RENDER PINS ── */
const bgClasses = ['bg-1','bg-2','bg-3','bg-4','bg-5','bg-6'];

function renderPins(pins) {
  const grid  = document.getElementById('pins-grid');
  const stats = document.getElementById('stats-bar');
  stats.innerHTML = `<div class="stat-pill">Total pins: <strong>${pins.length}</strong></div>`;
  if (!pins.length) {
    grid.innerHTML = '<div class="no-results"><p>No public pins yet. Be the first to create one!</p></div>';
    return;
  }
  const sortedPins = [...pins].sort((a, b) => {
    const aRead = isPinRead(a.pin_id);
    const bRead = isPinRead(b.pin_id);
    if (aRead === bRead) return 0;
    return aRead ? 1 : -1;
  });
  grid.innerHTML = sortedPins.map((p, i) => {
    const initials = p.author ? p.author.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2) : 'U';
    const bg = bgClasses[i % bgClasses.length];

    // Use image_urls array and media_type from API
    let images = p.image_urls || [];
    if (!Array.isArray(images)) images = [];
    const hasMedia = images.length > 0;
    const isVideo = p.media_type === 'video' && hasMedia;
    const firstUrl = hasMedia ? resolveImageUrl(images[0]) : '';

    let mediaContent = '';
    let mediaCounter = '';
    let imgStyle = '';

    if (isVideo) {
      mediaContent = `<video class="pin-video" src="${firstUrl}" muted playsinline style="width:100%; height:100%; object-fit:cover; display:block;" onmouseover="this.play()" onmouseout="this.pause(); this.currentTime=0;"></video>`;
      mediaCounter = '';
    } else if (hasMedia) {
      imgStyle = `background-image: url('${firstUrl}'); background-size: cover; background-position: center;`;
      mediaCounter = images.length > 1 ? `<div style="position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.5); color:#fff; padding:4px 10px; border-radius:20px; font-size:0.75rem; font-weight:600;"><i class="fas fa-images"></i> ${images.length}</div>` : '';
    } else {
      mediaContent = `<svg width="60" height="60" viewBox="0 0 24 24" fill="white" stroke="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`;
    }

    return `
      <div class="pin-card ${isPinRead(p.pin_id) ? 'read' : 'unread'}" onclick="openPinModal(${p.pin_id})" style="animation-delay: ${i * 0.05}s">
        <div class="pin-img ${hasMedia ? '' : bg}" style="${imgStyle}">
          ${mediaContent}
          ${mediaCounter}
          <div class="pin-loc-badge">${p.location_name || 'Campus'}</div>
        </div>
        <div class="pin-body">
          <div class="pin-meta">
            <div class="pin-avatar">${initials}</div>
            <div class="pin-author">${p.author || 'Anonymous'}</div>
            <div class="pin-date">${p.created_at ? String(p.created_at).slice(0,10) : ''}</div>
          </div>
          <div class="pin-title">${p.title}</div>
          <div class="pin-story">${p.content}</div>
        </div>
        <div class="pin-footer">
          <span class="category-tag tag-campus">Pin #${p.pin_id}</span>
        </div>
      </div>`;
  }).join('');
}

/* ── CLIENT-SIDE SEARCH ── */
function filterPins() {
  const search = val('search-input').toLowerCase();
  renderPins(allPins.filter(p =>
    !search ||
    (p.title && p.title.toLowerCase().includes(search)) ||
    (p.content && p.content.toLowerCase().includes(search))
  ));
}

/* ── Init ── */
window.addEventListener('load', () => {
  const isFirstLoad = !sessionStorage.getItem('pins_visited');
  if (isFirstLoad) {
    sessionStorage.setItem('pins_visited', 'true');
    setTimeout(() => {
      document.getElementById('loader').classList.add('hidden');
      setTimeout(() => document.getElementById('loader').remove(), 400);
    }, 1400);
  } else {
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('loader').remove();
  }
  loadPins();
});

/* ── PIN MODAL ── */
function openPinModal(pinId) {
  const pin = allPins.find(p => p.pin_id === pinId);
  if (!pin) return;
  markPinAsRead(pinId);
  // Visually mark card as read immediately
  document.querySelectorAll('.pin-card').forEach(card => {
    if (card.onclick && card.onclick.toString().includes('openPinModal(' + pinId + ')')) {
      card.classList.remove('unread');
      card.classList.add('read');
    }
  });
  const overlay = document.getElementById('pin-modal-overlay');
  const content = document.getElementById('modal-pin-content');

  // Use image_urls array from API (already parsed from JSON)
  let images = pin.image_urls || [];
  if (!Array.isArray(images)) images = [];

  images = images.map(resolveImageUrl);
  const isVideoUrl = (url) => url && (url.endsWith('.mp4') || url.endsWith('.webm') || url.endsWith('.mov'));

  let imgSection = '';
  if (images.length === 1) {
    if (isVideoUrl(images[0])) {
      imgSection = `<video controls style="width:100%; border-radius:14px; margin-bottom:1.25rem; box-shadow:0 4px 20px rgba(0,0,0,0.1);" src="${images[0]}"></video>`;
    } else {
      imgSection = `<div class="modal-pin-image" onclick="openImageViewer('${images[0]}')" style="background-image: url('${images[0]}'); background-size: cover; background-position: center; height: 220px; border-radius: 14px; margin-bottom: 1.25rem; cursor: zoom-in; position: relative;"><div style="position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,0.5); color:#fff; padding:4px 10px; border-radius:20px; font-size:0.75rem; pointer-events:none;"><i class="fas fa-expand"></i> Click to expand</div></div>`;
    }
  } else if (images.length > 1) {
    imgSection = `<div class="modal-image-carousel" style="display:flex; gap:0.5rem; overflow-x:auto; margin-bottom:1.25rem; padding-bottom:0.5rem;">
      ${images.map((img, i) => {
        if (isVideoUrl(img)) {
          return `<div style="flex-shrink:0; width:160px; height:120px; border-radius:12px; position:relative; border:2px solid var(--gray-200); overflow:hidden; background:#000;">
            <video src="${img}" style="width:100%; height:100%; object-fit:cover;" muted playsinline></video>
            <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.2);"><i class="fas fa-play" style="color:#fff; font-size:1.2rem;"></i></div>
            <span style="position:absolute; bottom:6px; right:6px; background:rgba(0,0,0,0.5); color:#fff; padding:2px 8px; border-radius:10px; font-size:0.7rem;">${i+1}/${images.length}</span>
          </div>`;
        }
        return `<div onclick="openImageViewer('${img}')" style="flex-shrink:0; width:160px; height:120px; border-radius:12px; background-image:url('${img}'); background-size:cover; background-position:center; cursor:zoom-in; position:relative; border:2px solid var(--gray-200); transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'"><span style="position:absolute; bottom:6px; right:6px; background:rgba(0,0,0,0.5); color:#fff; padding:2px 8px; border-radius:10px; font-size:0.7rem;">${i+1}/${images.length}</span></div>`;
      }).join('')}
    </div>`;
  }

  content.innerHTML = `
    ${imgSection}
    <div class="modal-pin-header">
      <div>
        <div class="pin-title" style="font-size:1.5rem;">${pin.title}</div>
        <div class="pin-meta modal-meta" style="margin-top:0.5rem;">
          <div class="pin-avatar">${(pin.author || 'U').split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2)}</div>
          <span>${pin.author || 'Anonymous'}</span>
          <span>${pin.created_at ? new Date(pin.created_at).toLocaleDateString() : ''}</span>
        </div>
      </div>
    </div>
    <div class="modal-pin-body">
      <div class="pin-location"><i class="fas fa-location-dot"></i>${pin.location_name || 'Campus'}</div>
      <p style="line-height:1.75; color:var(--gray-700); font-size:1rem; margin-top:0.75rem;">${pin.content}</p>
    </div>
  `;
  overlay.classList.add('visible');
}

function closePinModal(event) {
  if (event) event.stopPropagation();
  document.getElementById('pin-modal-overlay').classList.remove('visible');
}

function openImageViewer(imageUrl) {
  const viewer = document.createElement('div');
  viewer.id = 'image-viewer-overlay';
  viewer.style.cssText = 'position:fixed; inset:0; background:rgba(12,22,44,0.92); z-index:100000; display:flex; align-items:center; justify-content:center; padding:2rem; cursor:zoom-out; animation: fadeIn 0.2s ease;';
  viewer.innerHTML = `
    <img src="${imageUrl}" style="max-width:100%; max-height:90vh; object-fit:contain; border-radius:12px; box-shadow:0 24px 80px rgba(0,0,0,0.4); cursor:default;" onclick="event.stopPropagation()">
    <button onclick="document.getElementById('image-viewer-overlay').remove(); event.stopPropagation();" style="position:absolute; top:20px; right:20px; width:44px; height:44px; border:none; border-radius:50%; background:rgba(255,255,255,0.15); color:#fff; font-size:1.4rem; cursor:pointer; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(10px);">&times;</button>
  `;
  viewer.onclick = () => viewer.remove();
  document.addEventListener('keydown', function escClose(e) {
    if (e.key === 'Escape') {
      viewer.remove();
      document.removeEventListener('keydown', escClose);
    }
  });
  document.body.appendChild(viewer);
}
</script>

<!-- Pin Detail Modal -->
<div id="pin-modal-overlay" class="modal-overlay" onclick="closePinModal(event)">
  <div class="pin-modal" onclick="event.stopPropagation()">
    <button class="modal-close-btn" onclick="closePinModal(event)">&times;</button>
    <div id="modal-pin-content"></div>
  </div>
</div>
</body>
</html>
